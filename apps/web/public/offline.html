<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#315d49">
    <title>Webubble is offline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #fbfaf6; color: #203b32; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 28rem); padding: 28px; border: 1px solid #e7e9e1; border-radius: 20px; background: white; }
      h1 { margin-top: 0; }
      p { line-height: 1.6; color: #65756e; }
      button { min-height: 48px; padding: 0 18px; border: 0; border-radius: 999px; background: #315d49; color: white; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to continue browsing Webubble. For your security, account and checkout information is never saved for offline use.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
